services:
  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper-asr
    ports:
      - "9000:9000"
    environment:
      ASR_ENGINE: "faster_whisper"

      # 把 ASR_MODEL 指向容器内的“模型目录”
      ASR_MODEL: "/models/faster-whisper-large-v3-turbo-ct2"

      # GPU + 量化
      ASR_DEVICE: "cuda"
      ASR_QUANTIZATION: "float16"

      # 可选
      SAMPLE_RATE: "16000"
      MODEL_IDLE_TIMEOUT: "0"  # 0 = 常驻；也可以改成 300 之类让它空闲卸载

    volumes:
      # 模型目录挂载到容器内（Linux 路径；请先用 huggingface-cli 下载到此位置）
      # 注意：Compose 不展开 ~，用 ${HOME} 或绝对路径
      - "${HOME}/.cache/huggingface/faster-whisper-large-v3-turbo-ct2:/models/faster-whisper-large-v3-turbo-ct2:ro"

    restart: unless-stopped
    gpus: all

    # 健康检查：容器内无 curl/wget，用 python urllib 探活
    # 端点用 /openapi.json：纯数据接口，FastAPI 内部缓存，比 /docs 的 HTML 壳更轻
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # whisper turbo 模型加载预留 3 分钟
    networks:
      llm-net:
        aliases: # http://whisper-asr:9000 可在容器网络内访问
          - whisper-asr

# external 需要 docker network create llm-net；或与其他 compose 共用同一外部网络
networks:
  llm-net:
    external: true
    name: llm-net