name: kokoro-fastapi-cpu

services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # 国内源 ghcr.nju.edu.cn/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    pull_policy: if_not_present

    ports:
      - "8880:8880"

    environment:
      PYTHONPATH: /app:/app/api
      USE_GPU: "false"
      DEVICE_TYPE: cpu
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: DEBUG

      # CPU / ONNX 优化参数，保留你原来的配置，根据实际CPU核心数调整
      ONNX_NUM_THREADS: "16"
      ONNX_INTER_OP_THREADS: "4"
      ONNX_EXECUTION_MODE: parallel
      ONNX_OPTIMIZATION_LEVEL: all
      ONNX_MEMORY_PATTERN: "true"
      ONNX_ARENA_EXTEND_STRATEGY: kNextPowerOfTwo

    restart: unless-stopped

    # 健康检查：容器内有 curl，调用 kokoro-fastapi 的 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8880/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # kokoro 82M 模型加载快，1 分钟足够