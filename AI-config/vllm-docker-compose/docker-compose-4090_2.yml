services:
  vllm:
    image: vllm/vllm-openai:v0.12.0
    container_name: vllm-qwen3-4090_2
    ports:
      - "8123:8000"
    volumes:
      - "D:/dev_software/AI_models/huggingface/Qwen3-30B-A3B-FP8:/models/Qwen3-30B-A3B-FP8:ro"
      # # 可选：挂 HuggingFace cache（避免容器内重复下载 tokenizer/依赖）
      # - "D:/dev_software/AI_models/huggingface/_cache:/root/.cache/huggingface"
    gpus: "device=0,1"
    ipc: host
    shm_size: "24gb"
    environment:
      - TZ=Asia/Shanghai
    command:
      - "/models/Qwen3-30B-A3B-FP8"
      - "--served-model-name"
      - "Qwen3-30B-A3B-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--override-generation-config"
      - '{"temperature":0.2,"top_p":0.9}'

      # 两卡张量并行
      - "--tensor-parallel-size"
      - "2"

      # 工具调用
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"

      # 并发/吞吐给更宽松的上限
      - "--max-model-len"
      - "16384"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "65536"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      - "--gpu-memory-utilization"
      - "0.90"

    # 健康检查：vLLM 标准 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 30B MoE 双卡 TP 加载需要时间，预留 5 分钟
    networks:
      llm-net:
        aliases: #  http://vllm:8000 可以容器网络内访问
          - vllm

# external 需要 docker network create llm-net; 或者一起编排
networks:
  llm-net:
    external: true
    name: llm-net
