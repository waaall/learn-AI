services:
  vllm:
    image: vllm/vllm-openai:v0.21.0-cu129
    container_name: vllm-qwen36-35b-a3b
    ports:
      - "8123:8000"
    restart: always
    volumes:
      # 宿主机模型目录 -> 容器内只读路径
      - "~/.cache/huggingface/qwen36-35b-a3b-fp8:/models/Qwen3.6-35B-A3B-FP8:ro"
      # # 可选：挂 HuggingFace cache（避免容器内重复下载 tokenizer/依赖）
      # - "~/.cache/huggingface/_cache:/root/.cache/huggingface"
    gpus: all
    ipc: host
    shm_size: "32gb"
    environment:
      - TZ=Asia/Shanghai
      - VLLM_USE_FLASHINFER_MOE_FP8=1
      - VLLM_FLASHINFER_MOE_BACKEND=latency
      - VLLM_USE_DEEP_GEMM=0
      - VLLM_USE_TRTLLM_ATTENTION=0
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN

    command:
      - "/models/Qwen3.6-35B-A3B-FP8"
      - "--served-model-name"
      - "Qwen3.6-35B-A3B-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--override-generation-config"
      - '{"temperature":0.2,"top_p":0.9}'

      # 工具调用
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"

      # 上下文 + 并发设置
      - "--max-model-len"
      - "16384"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "65536"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"

      # # KV cache 用 FP8，省显存，提升并发承载
      # # 可能有bug(模型不支持校准精度会有问题)
      # - "--kv-cache-dtype"
      # - "fp8"
      # - "--calculate-kv-scales"
    networks:
      llm-net:
        aliases: #  http://vllm:8000 可以容器网络内访问
          - vllm

# external 需要 docker network create llm-net; 或者一起编排
networks:
  llm-net:
    external: true
    name: llm-net
