services:
  vllm:
    image: vllm/vllm-openai:v0.21.0-cu129
    container_name: vllm-qwen36-35b-a3b
    ports:
      - "8123:8000"
    restart: always
    volumes:
      # 宿主机模型目录 -> 容器内只读路径
      - "${HOME}/.cache/huggingface/qwen36-35b-a3b-fp8:/models/Qwen3.6-35B-A3B-FP8:ro"
      # # 可选：挂 HuggingFace cache（避免容器内重复下载 tokenizer/依赖）
      # - "${HOME}/.cache/huggingface/_cache:/root/.cache/huggingface"
    gpus: all
    ipc: host
    shm_size: "32gb"
    environment:
      - TZ=Asia/Shanghai
      # RTX PRO 6000 / SM_120 下，Qwen3.6 FP8 MoE 强制 FlashInfer 会触发后端量化格式不支持
      # DeepGEMM 是 SM_100 上 block FP8 的最优后端，但 RTX PRO 6000 是 SM_120，DeepGEMM 目前不支持，必须用 Triton 后端
      - VLLM_USE_FLASHINFER_MOE_FP8=0
      - VLLM_USE_DEEP_GEMM=0

    command:
      - "/models/Qwen3.6-35B-A3B-FP8"
      - "--served-model-name"
      - "Qwen3.6-35B-A3B-FP8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--override-generation-config"
      - '{"temperature":0.2,"top_p":0.9}'

      # 工具调用
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"

      # 上下文 + 并发设置
      - "--max-model-len"
      - "98304"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "65536"
      # 这个模型 + 常驻 buffer占用大约 42GB + KV cache 64K * 8 大约 16GB = 60GB (最好先让Embeddings跑)
      - "--gpu-memory-utilization"
      - "0.70"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"
      # RTX PRO 6000 是 SM_120（工作站 Blackwell, GB202），DeepGEMM 只支持 SM_90/SM_100，
      # 这里只能用 Triton（也是 SM_120 上 block FP8 的实际最优后端）
      - "--moe-backend"
      - "triton"

      # # KV cache 用 FP8，省显存，提升并发承载
      # # 可能有bug(模型不支持校准精度会有问题)
      # - "--kv-cache-dtype"
      # - "fp8"
      # - "--calculate-kv-scales"

    # 健康检查：vLLM 标准 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s  # 35B MoE FP8 加载较慢，预留 15 分钟
    networks:
      llm-net:
        aliases: #  http://vllm:8000 可以容器网络内访问
          - vllm

# external 需要 docker network create llm-net; 或者一起编排
networks:
  llm-net:
    external: true
    name: llm-net
