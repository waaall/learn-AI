services:
  vllm-embed:
    image: vllm/vllm-openai:v0.21.0-cu129
    container_name: vllm-qwen3-embed-4b
    ports:
      - "8124:8000"
    restart: always
    volumes:
      # 宿主机模型目录 -> 容器内只读路径
      - "${HOME}/.cache/huggingface/qwen3-embedding-4b:/models/Qwen3-Embedding-4B:ro"
    gpus: all
    ipc: host
    shm_size: "8gb"
    environment:
      - TZ=Asia/Shanghai

    command:
      - "/models/Qwen3-Embedding-4B"
      - "--served-model-name"
      - "Qwen3-Embedding-4B"

      # 使用 pooling runner，启用 /v1/embeddings 路由
      - "--runner"
      - "pooling"

      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"

      # embedding 一般 8K 上下文够用（Qwen3-Embedding 原生最大 32K，按需求调）
      - "--max-model-len"
      - "8192"

      # embedding 是单次 forward，可以开大批量提高吞吐
      - "--max-num-seqs"
      - "8"

      - "--max-num-batched-tokens"
      - "8192"

      # 4B BF16 权重约 8GB + workspace 约 1GB + KV cache 8G
      - "--gpu-memory-utilization"
      - "0.2"

    # 健康检查：vLLM 标准 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # embedding 模型较小，5 分钟
    networks:
      llm-net:
        aliases: # http://vllm-embed:8000 容器网络内访问
          - vllm-embed

networks:
  llm-net:
    external: true
    name: llm-net
