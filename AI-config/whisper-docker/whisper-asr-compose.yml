services:
  stt:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper-asr
    ports:
      - "9000:9000"
    environment:
      ASR_ENGINE: "faster_whisper"

      # 把 ASR_MODEL 指向容器内的“模型目录”
      ASR_MODEL: "/models/faster-whisper-large-v3-turbo-int8-ct2"

      # GPU + 量化
      ASR_DEVICE: "cuda"
      ASR_QUANTIZATION: "int8"

      # 可选
      SAMPLE_RATE: "16000"
      MODEL_IDLE_TIMEOUT: "0"  # 0 = 常驻；也可以改成 300 之类让它空闲卸载

    volumes:
      # 模型目录挂载到容器内（Linux 路径；请先用 huggingface-cli 下载到此位置）
      - "~/.cache/huggingface/faster-whisper-large-v3-turbo-int8-ct2:/models/faster-whisper-large-v3-turbo-int8-ct2:ro"

    restart: unless-stopped
    gpus: all

    networks:
      llm-net:
        aliases: # http://whisper-asr:9000 可在容器网络内访问
          - whisper-asr

# external 需要 docker network create llm-net；或与其他 compose 共用同一外部网络
networks:
  llm-net:
    external: true
    name: llm-net