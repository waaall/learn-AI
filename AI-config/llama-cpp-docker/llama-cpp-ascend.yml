services:
  llamacpp:
    image: llama-cann:full
    container_name: llamacpp-qwen3-30b
    ports:
      - "8123:8080"
    restart: unless-stopped
    network_mode: host
    shm_size: "32g"
    ipc: host

    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc

    volumes:
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /etc/ascend_install.info:/etc/ascend_install.info
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /root/.cache:/root/.cache
      - /home/LLM_project/models/GUFF/Qwen3-30B-A3B-Q4_0:/models:ro  # 模型

    entrypoint: ["/app/llama-server"]   # 如果 full 镜像入口不是 llama-server，就加这一行

    command:
      - -m
      - /models/Qwen3-30B-A3B-Q4_0.gguf
      - --n-gpu-layers
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8080"