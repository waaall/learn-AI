services:
  llamacpp:
    image: ghcr.nju.edu.cn/ggml-org/llama.cpp:full-cuda
    container_name: llamacpp-cuda
    ports:
      - "8123:8123"
    restart: unless-stopped
    shm_size: "16g"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # 模型路径（根据实际情况修改）
      - /path/to/models:/models:ro
      # 可选：缓存目录
      # - ~/.cache:/root/.cache
    environment:
      - TZ=Asia/Shanghai
      - CUDA_VISIBLE_DEVICES=all
    entrypoint: ["/llama-server"]
    command:
      - -m
      - /models/your-model.gguf
      - -c
      - "4096"
      - -b
      - "2048"
      - --n-gpu-layers
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8123"
      # 可选：并发请求数
      # - --parallel
      # - "4"
      # 可选：连续批处理
      # - --cont-batching
      # 可选：Flash Attention
      # - --flash-attn
