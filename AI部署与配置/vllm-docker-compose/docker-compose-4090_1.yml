services:
  vllm:
    image: vllm/vllm-openai:v0.12.0
    container_name: vllm-qwen3-4090-awq
    ports:
      - "8123:8000"
    restart: always
    volumes:
      - "${AI_MODEL_ROOT}/Qwen3-30B-A3B-AWQ-4bit:/models/qwen3-awq:ro"
      # # 可选：挂 HuggingFace cache（避免容器内重复下载 tokenizer/依赖）
      # - "${AI_HF_CACHE}:/root/.cache/huggingface"
    gpus: all
    ipc: host
    shm_size: "16gb"
    environment:
      - TZ=Asia/Shanghai
    command:
      # 基础
      - "/models/qwen3-awq"
      - "--served-model-name"
      - "Qwen3-30B-A3B-Instruct-2507-AWQ-4bit"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--override-generation-config"
      - '{"temperature":0.2,"top_p":0.9}'

      # 工具调用
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"

      # RAG + 并发
      - "--max-model-len"
      - "12288"
      - "--max-num-seqs"
      - "4"
      # 让一次迭代能吃下更多并发的 prefill（配合 chunked prefill）
      - "--max-num-batched-tokens"
      - "36864"
      - "--enable-prefix-caching"
      - "--enable-chunked-prefill"

      # 显存上限(预留避免OOM)
      - "--gpu-memory-utilization"
      - "0.90"

      # # 日志（可选，降低开销）
      # - "--uvicorn-log-level"
      # - "warning"
      # - "--disable-log-requests"
    # 健康检查：vLLM 标准 /health 端点
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 大模型加载需要时间，预留 5 分钟
    networks:
      llm-net:
        aliases: #  http://vllm:8000 可以容器网络内访问
          - vllm

# external 需要 docker network create llm-net; 或者一起编排
networks:
  llm-net:
    external: true
    name: llm-net
