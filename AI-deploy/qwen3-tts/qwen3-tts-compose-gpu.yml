# 在 GPU 服务器本地构建，默认不拉取远端成品镜像。
name: qwen3-tts-api
services:
  qwen3-tts:
    image: local/qwen3-tts-api:custom-voice
    pull_policy: never
    build:
      context: .
      dockerfile: qwen3-tts.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.ustc.edu.cn/ubuntu}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.ustc.edu.cn/ubuntu}
        APT_FALLBACK_MIRRORS: ${APT_FALLBACK_MIRRORS-https://mirrors.tuna.tsinghua.edu.cn/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu https://archive.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.ustc.edu.cn/pypi/simple}
        PIP_FALLBACK_INDEX_URLS: ${PIP_FALLBACK_INDEX_URLS-https://pypi.tuna.tsinghua.edu.cn/simple https://pypi.org/simple}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-18765}:8080"
    volumes:
      - "${MODEL_CACHE_DIR:-./models}:/root/.cache/huggingface"
    environment:
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      DTYPE: ${DTYPE:-bfloat16}
      ATTN_IMPLEMENTATION: ${ATTN_IMPLEMENTATION:-sdpa}
      DEVICE: cuda:0
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_FALLBACK_TO_OFFICIAL: ${HF_FALLBACK_TO_OFFICIAL:-1}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-30}
      MODEL_REVISION: ${MODEL_REVISION:-main}
      MODEL_DOWNLOAD_ATTEMPTS: ${MODEL_DOWNLOAD_ATTEMPTS:-2}
      MODEL_DOWNLOAD_TIMEOUT: ${MODEL_DOWNLOAD_TIMEOUT:-900}
      MODEL_DOWNLOAD_WORKERS: ${MODEL_DOWNLOAD_WORKERS:-4}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-Vivian}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-Auto}
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-2000}
      STREAM_CHUNK_SIZE: ${STREAM_CHUNK_SIZE:-8}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STARTUP_LOG_INTERVAL: ${STARTUP_LOG_INTERVAL:-30}
      PORT: "8080"
    # 自动轮转日志，单文件 20 MB，最多保留 10 个。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    # 启动失败最多自动重试三次，避免网络不可用时无限下载重启。
    restart: "on-failure:3"
